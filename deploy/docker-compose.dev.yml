# Local development dependencies for Aethera.
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: aethera-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aethera
      POSTGRES_PASSWORD: aethera
      POSTGRES_DB: aethera
    ports:
      - "5432:5432"
    volumes:
      - aethera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethera -d aethera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aethera_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aethera_pgdata:
  aethera_redisdata:
