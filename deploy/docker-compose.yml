# Aethera master (control plane + web UI + PostgreSQL + Redis) in one command:
#
#   cp deploy/.env.example deploy/.env      # set AETHERA_PUBLIC_HOST (and change the DB password)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# UI: http://<host>:8080   Agent gRPC (mTLS): <host>:9443 (slaves dial this; keep it reachable, no TLS-terminating proxy in front)
# The master machine itself becomes a deployment server by itself once you have registered (the agent container below is already waiting).
name: aethera

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aethera
      POSTGRES_PASSWORD: ${AETHERA_DB_PASSWORD:-aethera}
      POSTGRES_DB: aethera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethera -d aethera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  aethera:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.control-plane
    image: aethera/control-plane:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ConnectionStrings__Aethera: Host=postgres;Port=5432;Database=aethera;Username=aethera;Password=${AETHERA_DB_PASSWORD:-aethera}
      ConnectionStrings__Redis: redis:6379
      # What agents dial and what the gRPC server certificate names: a hostname/IP slaves can reach.
      Aethera__Agents__PublicEndpoint: ${AETHERA_PUBLIC_HOST:-localhost}:${AETHERA_GRPC_PORT:-9443}
      # Connect this machine's agent container as the "local" server once the first owner has registered (false: only Servers > Use this machine).
      Aethera__Agents__AutoLocalServer: ${AETHERA_AUTO_LOCAL_SERVER:-true}
      # Optional (base64 of 32 bytes). Unset = generated once and kept in the aethera_data volume.
      AETHERA_MASTER_KEY: ${AETHERA_MASTER_KEY:-}
    ports:
      - "${AETHERA_HTTP_PORT:-8080}:8080"
      - "${AETHERA_GRPC_PORT:-9443}:9443"
    volumes:
      - aethera_data:/data

  # The agent of the master machine itself. It waits, unenrolled, for Servers > "Use this machine" in the UI (the control plane hands it a
  # one-time join token through the shared aethera_data volume), then it runs as an ordinary agent. On Linux it runs in the host network
  # namespace (reaches every Docker network, survives a restart of the aethera container) and dials 127.0.0.1:<grpc port>; Docker Desktop
  # has no real host namespace, so add docker-compose.desktop.yml there (install.ps1 does): the agent then shares the control plane's
  # namespace and dials 127.0.0.1:9443. See ADR 0009.
  agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.agent
    image: aethera/agent:local
    restart: unless-stopped
    depends_on:
      - aethera
    network_mode: host
    environment:
      AETHERA_ENDPOINT: 127.0.0.1:${AETHERA_GRPC_PORT:-9443}
      AETHERA_ENROLL_DIR: /data/updater
      AETHERA_AGENT_NAME: local
      AETHERA_EXIT_AFTER_OFFLINE: ${AETHERA_AGENT_EXIT_AFTER_OFFLINE:-10m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/aethera:/var/lib/aethera
      - aethera_data:/data

volumes:
  pgdata:
  redisdata:
  aethera_data:
