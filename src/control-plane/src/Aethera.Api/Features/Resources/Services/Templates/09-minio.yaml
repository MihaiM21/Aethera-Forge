key: minio
name: MinIO
description: S3-compatible object storage (PGSTY Silo, the maintained community build of MinIO).
category: storage
image: pgsty/silo
command: [server, /data, --console-address, ":9001"]
versions: ["RELEASE.2026-11-12T00-00-00Z"]
ports:
  - port: 9000
  - port: 9001
    http: true
volumes:
  - name: data
    path: /data
healthCheck:
  type: http
  path: /minio/health/live
  port: 9000
env:
  - key: MINIO_ROOT_USER
    value: minio-admin
  - key: MINIO_ROOT_PASSWORD
    generate: password
