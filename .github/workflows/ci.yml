name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      # The build regenerates src/web/openapi/aethera.v1.json from the code. A diff means the API contract changed without the
      # committed document being updated (and doubles as the contract-change review).
      - name: OpenAPI document is up to date
        working-directory: ${{ github.workspace }}
        run: |
          git add --intent-to-add src/web/openapi
          git diff --exit-code src/web/openapi
      - run: dotnet test --no-build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make cross

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plugin versions match the headers of the committed generated code.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false
      - run: buf generate
      - name: Generated Go code is up to date
        run: |
          git add --intent-to-add src/agent/gen
          git diff --exit-code src/agent/gen

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
