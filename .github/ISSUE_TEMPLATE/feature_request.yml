name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Coming from Coolify or another tool? Say what you did there.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds you tried
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to work on this (see CONTRIBUTING.md)
